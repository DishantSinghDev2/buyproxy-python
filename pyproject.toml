[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "buyproxy"
dynamic = ["version"]
description = "Official BuyProxy Python SDK — generate residential, mobile, ISP and datacenter proxies, manage reseller customers and top up bandwidth. Sync + async, fully typed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "BuyProxy", email = "support@buyproxy.org" }]
keywords = [
  "buyproxy", "proxy", "proxies", "residential proxies", "rotating proxies", "mobile proxies", "isp proxies",
  "datacenter proxies", "socks5", "proxy api", "web scraping", "scrapy", "playwright", "requests", "httpx", "sdk",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://www.buyproxy.org"
Documentation = "https://www.buyproxy.org/docs/sdks"
"API Reference" = "https://www.buyproxy.org/docs/api-reference/introduction"
Repository = "https://github.com/DishantSinghDev2/buyproxy-python"
Issues = "https://github.com/DishantSinghDev2/buyproxy-python/issues"
Changelog = "https://github.com/DishantSinghDev2/buyproxy-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "mypy>=1.10", "ruff>=0.5"]

[tool.hatch.version]
path = "src/buyproxy/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/buyproxy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 140
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP006", "UP007"]
ignore = ["E501", "UP006", "UP007"]  # typing.List/Optional kept on purpose for Python 3.9 support
